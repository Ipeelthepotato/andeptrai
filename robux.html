<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Đúng – Sai | Tin học 12 Giữa kỳ 1</title>
  <style>
    :root {
      --primary: #2563eb;
      --correct: #16a34a;
      --wrong: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --stem-bg: #f1f5f9;
      --option-bg: #f8fafc;
      --score-bg: #ffffff;
      --header-grad: linear-gradient(135deg, #1e40af, #3b82f6);
      --badge-bg: #dbeafe;
      --badge-text: #1e40af;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --wrong-bg: #fef2f2;
      --wrong-border: #fca5a5;
      --opt-correct-bg: #dcfce7;
      --opt-wrong-bg: #fee2e2;
      --btn-border: #cbd5e1;
      --shadow: rgba(0,0,0,0.06);
      --header-shadow: rgba(37, 99, 235, 0.25);
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --correct: #22c55e;
      --wrong: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --stem-bg: #0f172a;
      --option-bg: #0f172a;
      --score-bg: #1e293b;
      --header-grad: linear-gradient(135deg, #1e3a8a, #2563eb);
      --badge-bg: #1e3a8a;
      --badge-text: #93c5fd;
      --correct-bg: #052e16;
      --correct-border: #166534;
      --wrong-bg: #450a0a;
      --wrong-border: #991b1b;
      --opt-correct-bg: #14532d;
      --opt-wrong-bg: #7f1d1d;
      --btn-border: #475569;
      --shadow: rgba(0,0,0,0.3);
      --header-shadow: rgba(37, 99, 235, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      transition: background 0.25s, color 0.25s;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
      padding: 24px;
      background: var(--header-grad);
      color: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px var(--header-shadow);
      position: relative;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    header p {
      opacity: 0.9;
      font-size: 0.95rem;
    }
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.08);
    }
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--score-bg);
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px var(--shadow);
      font-weight: 600;
      position: sticky;
      top: 12px;
      z-index: 10;
      border: 1px solid var(--border);
      transition: background 0.25s, border-color 0.25s;
    }
    .score-bar .result {
      font-size: 1.1rem;
    }
    .question-card {
      background: var(--card);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px var(--shadow);
      border: 1px solid var(--border);
      transition: border-color 0.2s, background 0.25s;
    }
    .question-card.checked-correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }
    .question-card.checked-wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }
    .q-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .q-title .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .stem {
      background: var(--stem-bg);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      border-left: 4px solid var(--primary);
      color: var(--text);
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--option-bg);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .option:hover {
      background: var(--stem-bg);
    }
    .option.correct-ans {
      background: var(--opt-correct-bg);
      border-color: var(--correct-border);
    }
    .option.wrong-ans {
      background: var(--opt-wrong-bg);
      border-color: var(--wrong-border);
    }
    .option-label {
      font-weight: 700;
      color: var(--text-muted);
      min-width: 22px;
    }
    .option-text {
      flex: 1;
      font-size: 0.95rem;
    }
    .choices {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .choices label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--btn-border);
      background: var(--card);
      color: var(--text);
      user-select: none;
      transition: all 0.15s;
    }
    .choices label:hover {
      border-color: var(--primary);
    }
    .choices input {
      display: none;
    }
    .choices label:has(input[value="D"]:checked) {
      background: var(--correct);
      border-color: var(--correct);
      color: white;
    }
    .choices label:has(input[value="S"]:checked) {
      background: var(--wrong);
      border-color: var(--wrong);
      color: white;
    }
    .feedback {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 4px;
      display: none;
    }
    .feedback.show {
      display: block;
    }
    .feedback.ok { color: var(--correct); }
    .feedback.err { color: var(--wrong); }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 28px 0 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-check {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .btn-check:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37,99,235,0.4);
    }
    .btn-reset {
      background: var(--card);
      color: var(--text);
      border: 1.5px solid var(--btn-border);
    }
    .btn-reset:hover {
      background: var(--stem-bg);
    }
    .btn-show {
      background: #0f172a;
      color: white;
    }
    [data-theme="dark"] .btn-show {
      background: #e2e8f0;
      color: #0f172a;
    }
    .summary {
      text-align: center;
      padding: 20px;
      background: var(--card);
      border-radius: 14px;
      margin-top: 12px;
      display: none;
      box-shadow: 0 2px 8px var(--shadow);
      border: 1px solid var(--border);
    }
    .summary.show {
      display: block;
    }
    .summary .big-score {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      .option {
        flex-direction: column;
        gap: 8px;
      }
      .choices {
        width: 100%;
        justify-content: flex-end;
      }
      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

  <div class="container">
    <header>

      <h1>Luyện tập Đúng – Sai</h1>

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
    }
    // Load saved theme or system preference
    const saved = localStorage.getItem('theme');
    if (saved) {
      setTheme(saved);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    } else {
      setTheme('light');
    }
    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');

    const letters = ['a', 'b', 'c', 'd'];

    function renderQuiz() {
      const container = document.getElementById('quiz');
      container.innerHTML = '';
      questions.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q${q.id}`;
        let html = `
          <div class="q-title">
            <span class="badge">Câu ${q.id}</span>
          </div>
          <div class="stem">${q.stem}</div>
        `;
        q.options.forEach((opt, i) => {
          html += `
            <div class="option" id="opt-${q.id}-${i}">
              <span class="option-label">${letters[i]})</span>
              <div class="option-text">${opt}</div>
              <div class="choices">
                <label>
                  <input type="radio" name="q${q.id}_${i}" value="D" onchange="updateDone()">
                  <span>Đúng</span>
                </label>
                <label>
                  <input type="radio" name="q${q.id}_${i}" value="S" onchange="updateDone()">
                  <span>Sai</span>
                </label>
              </div>
              <div class="feedback" id="fb-${q.id}-${i}"></div>
            </div>
          `;
        });
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function updateDone() {
      let count = 0;
      questions.forEach(q => {
        for (let i = 0; i < 4; i++) {
          if (document.querySelector(`input[name="q${q.id}_${i}"]:checked`)) count++;
        }
      });
      document.getElementById('doneCount').textContent = count;
    }

    function checkAll() {
      let correct = 0;
      let total = 64;
      questions.forEach(q => {
        let qCorrect = 0;
        for (let i = 0; i < 4; i++) {
          const selected = document.querySelector(`input[name="q${q.id}_${i}"]:checked`);
          const fb = document.getElementById(`fb-${q.id}-${i}`);
          const optEl = document.getElementById(`opt-${q.id}-${i}`);
          const ans = answers[q.id][i];
          optEl.classList.remove('correct-ans', 'wrong-ans');
          if (!selected) {
            fb.textContent = 'Chưa chọn';
            fb.className = 'feedback show err';
            continue;
          }
          if (selected.value === ans) {
            correct++;
            qCorrect++;
            optEl.classList.add('correct-ans');
            fb.textContent = '✓ Đúng';
            fb.className = 'feedback show ok';
          } else {
            optEl.classList.add('wrong-ans');
            fb.textContent = `✗ Sai (Đáp án: ${ans === 'D' ? 'Đúng' : 'Sai'})`;
            fb.className = 'feedback show err';
          }
        }
        const card = document.getElementById(`q${q.id}`);
        card.classList.remove('checked-correct', 'checked-wrong');
        if (qCorrect === 4) card.classList.add('checked-correct');
        else card.classList.add('checked-wrong');
      });
      document.getElementById('liveScore').textContent = `Điểm: ${correct}/${total}`;
      const summary = document.getElementById('summary');
      summary.classList.add('show');
      document.getElementById('finalScore').textContent = `${correct}/${total}`;
      const percent = Math.round((correct / total) * 100);
      let msg = '';
      if (percent >= 90) msg = 'Xuất sắc! Bạn nắm rất vững phần này.';
      else if (percent >= 70) msg = 'Khá tốt! Còn vài chỗ cần ôn lại.';
      else if (percent >= 50) msg = 'Trung bình. Hãy xem lại những câu sai.';
      else msg = 'Cần ôn kỹ hơn. Hãy đọc lại lý thuyết và làm lại.';
      document.getElementById('finalText').textContent = msg;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAnswers() {
      questions.forEach(q => {
        for (let i = 0; i < 4; i++) {
          const ans = answers[q.id][i];
          const radios = document.querySelectorAll(`input[name="q${q.id}_${i}"]`);
          radios.forEach(r => {
            r.checked = (r.value === ans);
          });
          const fb = document.getElementById(`fb-${q.id}-${i}`);
          fb.textContent = `Đáp án: ${ans === 'D' ? 'Đúng' : 'Sai'}`;
          fb.className = 'feedback show ok';
          document.getElementById(`opt-${q.id}-${i}`).classList.add('correct-ans');
        }
        document.getElementById(`q${q.id}`).classList.add('checked-correct');
      });
      updateDone();
      document.getElementById('liveScore').textContent = 'Đáp án chuẩn đã hiện';
    }

    function resetAll() {
      questions.forEach(q => {
        for (let i = 0; i < 4; i++) {
          const radios = document.querySelectorAll(`input[name="q${q.id}_${i}"]`);
          radios.forEach(r => r.checked = false);
          const fb = document.getElementById(`fb-${q.id}-${i}`);
          fb.className = 'feedback';
          fb.textContent = '';
          document.getElementById(`opt-${q.id}-${i}`).classList.remove('correct-ans', 'wrong-ans');
        }
        const card = document.getElementById(`q${q.id}`);
        card.classList.remove('checked-correct', 'checked-wrong');
      });
      document.getElementById('doneCount').textContent = '0';
      document.getElementById('liveScore').textContent = 'Điểm: —';
      document.getElementById('summary').classList.remove('show');
    }

    renderQuiz();
  </script>
</body>
