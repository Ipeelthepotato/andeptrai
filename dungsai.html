<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Đúng - Sai | Lịch sử 12 - Giữa kỳ 1</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --success: #059669;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
      padding: 24px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(30, 64, 175, 0.08);
    }
    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 6px;
    }
    header p {
      color: #64748b;
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: #1e3a8a; transform: translateY(-1px); }
    .btn-secondary {
      background: #e0e7ff;
      color: var(--primary);
    }
    .btn-secondary:hover { background: #c7d2fe; }
    .btn-success {
      background: var(--success);
      color: white;
    }
    .btn-success:hover { background: #047857; }
    .question-card {
      background: var(--card);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s;
    }
    .question-card:hover {
      box-shadow: 0 6px 20px rgba(30, 64, 175, 0.1);
    }
    .q-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .q-number {
      background: var(--primary);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .q-title {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--primary);
    }
    .passage {
      background: #f1f5f9;
      border-left: 4px solid var(--primary-light);
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
      color: #334155;
      max-height: 180px;
      overflow-y: auto;
    }
    .statement {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .statement:hover { background: #f1f5f9; }
    .statement.correct-bg { background: #ecfdf5; border-color: #a7f3d0; }
    .statement.wrong-bg { background: #fef2f2; border-color: #fecaca; }
    .stmt-text {
      flex: 1;
      font-size: 0.95rem;
    }
    .options {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .opt-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .opt-btn.selected-dung {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
    }
    .opt-btn.selected-sai {
      background: #fee2e2;
      border-color: var(--danger);
      color: var(--danger);
    }
    .opt-btn:disabled { cursor: default; opacity: 0.85; }
    .result-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }
    .badge-correct { background: #d1fae5; color: #065f46; }
    .badge-wrong { background: #fee2e2; color: #991b1b; }
    #score-panel {
      display: none;
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    #score-panel.show { display: block; }
    .score-big {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }
    .score-text { color: #64748b; margin: 8px 0 16px; }
    .progress-bar {
      height: 10px;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
      margin: 12px auto;
      max-width: 300px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-light), var(--success));
      border-radius: 5px;
      transition: width 0.6s ease;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 1.3rem; }
      .statement { flex-direction: column; gap: 8px; }
      .options { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Quiz Đúng – Sai</h1>
      <p>Lịch sử 12 · Ôn tập Giữa kỳ 1 · Liên hợp quốc · Trật tự Ianta · ASEAN</p>
    </header>

    <div class="controls">
      <button class="btn-secondary" onclick="shuffleQuestions()">🔀 Trộn câu hỏi</button>

    <footer>
      File quiz tự tạo · Có thể chia sẻ file HTML này cho bạn bè · Mở bằng trình duyệt

  <script>
    // Dữ liệu gốc
    const originalQuestions = [
      {
        id: 1,
        title: "Câu 1",
        passage: `"Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế - chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hung thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật".`,
        statements: [
          { key: "a", text: "Xu thế chủ đạo trong quan hệ giữa các nước sau Chiến tranh lạnh là hợp tác và cạnh tranh về kinh tế - chính trị.", correct: true },
          { key: "b", text: "Sức mạnh tổng hợp quốc gia bao gồm hai yếu tố chính là kinh tế và khoa học – kĩ thuật.", correct: true },
          { key: "c", text: "Sự tổn thất trong cuộc chạy đua vũ trang là một trong những nguyên nhân dẫn đến việc Mỹ và Liên Xô chấm dứt Chiến tranh lạnh.", correct: true },
          { key: "d", text: "Sự vươn lên của Đức, Nhật và NICs đã tác động đến sự hình thành trật tự đơn cực, nhiều trung tâm trong quan hệ quốc tế sau Chiến tranh lạnh.", correct: false }
        ]
      },
      {
        id: 2,
        title: "Câu 2",
        passage: `"Trật tự thế giới mới này được hình thành như thế nào, còn tuỳ thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp. Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa); Sự phát triển của cách mạng khoa học – kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới".`,
        statements: [
          { key: "a", text: "Trật tự thế giới mới được hình thành sau Chiến tranh lạnh phụ thuộc ở nhiều nhân tố, trong đó nhân tố quyết định là sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa.", correct: false },
          { key: "b", text: "Trong cuộc chạy đua về sức mạnh quốc gia tổng hợp quốc gia, yếu tố quan trọng là một nền kinh tế vững chắc, một nền tài chính phồn vinh.", correct: true },
          { key: "c", text: "Cuộc cách mạng công nghiệp lần thứ ba hiện nay sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới.", correct: false },
          { key: "d", text: "Mỹ, Nga, Anh, Pháp, Nhật Bản, Đức là những cường quốc duy nhất có khả năng cạnh tranh để khẳng định vị thế trong trật tự thế giới mới.", correct: false }
        ]
      },
      {
        id: 3,
        title: "Câu 3",
        passage: `"Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị - xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mỹ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông – Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hoá dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới."`,
        statements: [
          { key: "a", text: "Sức mạnh kinh tế trên thế giới thay đổi, tất yếu về lâu dài cán cân sức mạnh chính trị cũng không thể không thay đổi trong trật tự thế giới.", correct: true },
          { key: "b", text: "Trật tự thế giới được xem như tiêu chí cơ bản định đoạt thực trạng các mối quan hệ quốc tế hiện có hoặc sẽ có của thế giới.", correct: false },
          { key: "c", text: "Sự vận động của các mâu thuẫn sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh.", correct: true },
          { key: "d", text: "Ngay sau khi Chiến tranh lạnh chấm dứt, trật tự đa cực nhiều trung tâm xuất hiện cùng với sự xuất hiện cuộc cách mạng công nghệ 4.0.", correct: false }
        ]
      },
      {
        id: 4,
        title: "Câu 4",
        passage: `"Xu thế "liên kết khu vực" đi đôi với xu thế "toàn cầu hóa" phát triển nhanh, như Liên minh châu Âu (EU), khu vực Mậu dịch tự do Bắc Mỹ (NAFTA), Hiệp hội ASEAN, Liên minh kinh tế Trung Mỹ (khối MERCOSUR), Hiệp hội tự do thương mại Mỹ latinh (LAFTA), Hiệp hội hải quan Trung Phi (CACU), Cộng đồng Đông Phi (EAC), Cộng đồng kinh tế các nước Tây Phi (ECOAC), Hiệp hội hợp tác khu vực các nước Nam Á (SAARC), v.v... Một thời kì mới trong quan hệ quốc tế đã bắt đầu, trong đó tất cả các quốc gia, dân tộc đều đang đứng trước những thử thách, những thời cơ để đưa vận mệnh đất nước mình tiến lên kịp với thời đại mới. Sự nghiệp bảo vệ hòa bình - mối quan tâm hàng đầu của toàn nhân loại, đang ngày càng tiến triển, mặc dù nguy cơ chiến tranh chưa phải đã chấm dứt."`,
        statements: [
          { key: "a", text: "Sự phát triển song hành của liên kết khu vực và toàn cầu hóa cho thấy các quốc gia vừa tăng cường hội nhập rộng lớn, vừa tìm kiếm những không gian hợp tác có lợi ích gần gũi hơn.", correct: true },
          { key: "b", text: "Sau Chiến tranh lạnh, hòa bình và hợp tác trở thành xu thế nổi bật, nhưng không đồng nghĩa nguy cơ chiến tranh và xung đột đã hoàn toàn bị loại bỏ.", correct: true },
          { key: "c", text: "Việc các quốc gia đứng trước cả thời cơ và thách thức cho thấy tác động của xu thế phát triển thế giới phụ thuộc một phần vào năng lực lựa chọn đường lối và tận dụng cơ hội của từng nước.", correct: true },
          { key: "d", text: "Toàn cầu hóa và liên kết khu vực phát triển đã làm lợi ích giữa các quốc gia ngày càng thống nhất, từ đó loại bỏ căn bản cạnh tranh trong quan hệ quốc tế.", correct: false }
        ]
      },
      {
        id: 5,
        title: "Câu 5",
        passage: `"Duy trì hoà bình và an ninh quốc tế, và để đạt được mục đích đó, thi hành những biện pháp tập thể có hiệu quả để phòng ngừa và loại trừ các mối đe doạ hoà bình, cấm mọi hành vi xâm lược và phá hoại hoà bình khác, điều chỉnh hoặc giải quyết các vụ tranh chấp hoặc những tình thế có tính chất quốc tế có thể đưa đến sự phá hoại hoà bình, bằng biện pháp hoà bình theo đúng nguyên tắc của công lí và pháp luật quốc tế". (Trích: Điều 1, Hiến chương Liên hợp quốc)`,
        statements: [
          { key: "a", text: "Đoạn tư liệu thể hiện mục tiêu của Liên hợp quốc là duy trì hoà bình và an ninh quốc phòng cho tất cả các quốc gia.", correct: false },
          { key: "b", text: "Một trong những mục tiêu của Liên hợp quốc là giải quyết các vụ tranh chấp quốc tế bằng pháp luật của các quốc gia.", correct: false },
          { key: "c", text: "Trong số các mục tiêu của Liên hợp quốc, duy trì hoà bình và an ninh quốc tế là mục tiêu được đặt lên hàng đầu.", correct: true },
          { key: "d", text: "Ngày nay, Liên hợp quốc vẫn tiếp tục thực hiện mục tiêu giải quyết các vụ tranh chấp, xung đột quốc tế bằng biện pháp hoà bình.", correct: true }
        ]
      },
      {
        id: 6,
        title: "Câu 6",
        passage: `"Tham gia ASEAN từ năm 1995, Việt Nam luôn chủ trương một ASEAN vững mạnh, đoàn kết và liên kết chặt chẽ là phù hợp với lợi ích chiến lược lâu dài của Việt Nam và của tất cả các nước thành viên ASEAN. Với tinh thần ‘chủ động, tích cực và có trách nhiệm’, Việt Nam cần đề ra và thực hiện."`,
        statements: [
          { key: "a", text: "Việt Nam chủ trương xây dựng một Cộng đồng ASEAN đoàn kết, vững mạnh và tăng cường liên kết giữa các nước thành viên.", correct: true },
          { key: "b", text: "Việt Nam xác định việc tham gia ASEAN là hoạt động mang tính hình thức, không gắn với lợi ích lâu dài của đất nước.", correct: false },
          { key: "c", text: "Tinh thần chủ động, tích cực và có trách nhiệm là một định hướng quan trọng trong quá trình Việt Nam tham gia xây dựng Cộng đồng ASEAN.", correct: true },
          { key: "d", text: "Học sinh Việt Nam có thể góp phần xây dựng Cộng đồng ASEAN bằng cách tìm hiểu về ASEAN, rèn luyện ngoại ngữ và tích cực tham gia các hoạt động giao lưu phù hợp.", correct: true }
        ]
      },
      {
        id: 7,
        title: "Câu 7",
        passage: `[Năm 1960] "Đại hội đồng Liên hợp quốc đã thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa. Đó là một sự kiện chính trị quan trọng. Như thế, Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế; khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức."`,
        statements: [
          { key: "a", text: "Liên hợp quốc đã đưa ra văn bản quan trọng nhằm thủ tiêu hệ thống thuộc địa của chủ nghĩa thực dân trên thế giới.", correct: true },

    let questions = JSON.parse(JSON.stringify(originalQuestions));
    let userAnswers = {}; // { qId: { stmtKey: true/false } }
    let submitted = false;

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleQuestions() {
      if (submitted) return;
      questions = shuffleArray([...questions]);
      // cũng trộn statements trong mỗi câu
      questions.forEach(q => {
        q.statements = shuffleArray([...q.statements]);
      });
      renderQuiz();
    }

    function shuffleStatements() {
      if (submitted) return;
      questions.forEach(q => {
        q.statements = shuffleArray([...q.statements]);
      });
      renderQuiz();
    }

    function resetQuiz() {
      questions = JSON.parse(JSON.stringify(originalQuestions));
      userAnswers = {};
      submitted = false;
      document.getElementById('score-panel').classList.remove('show');
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectAnswer(qId, stmtKey, value) {
      if (submitted) return;
      if (!userAnswers[qId]) userAnswers[qId] = {};
      userAnswers[qId][stmtKey] = value;
      renderQuiz(); // re-render để cập nhật UI selected
    }

    function submitQuiz() {
      submitted = true;
      let correctCount = 0;
      let total = 0;

      questions.forEach(q => {
        q.statements.forEach(s => {
          total++;
          const userVal = userAnswers[q.id] && userAnswers[q.id][s.key];
          if (userVal === s.correct) correctCount++;
        });
      });

      const percent = Math.round((correctCount / total) * 100);
      document.getElementById('score-number').textContent = `${correctCount}/${total}`;
      document.getElementById('score-detail').textContent = `Bạn đúng ${correctCount} / ${total} ý (${percent}%)`;
      document.getElementById('progress').style.width = percent + '%';
      document.getElementById('score-panel').classList.add('show');

      renderQuiz();
      document.getElementById('score-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function renderQuiz() {
      const area = document.getElementById('quiz-area');
      area.innerHTML = '';

      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-${q.id}`;

        let html = `
          <div class="q-header">
            <div class="q-number">${idx + 1}</div>
            <div class="q-title">${q.title}</div>
          </div>
          <div class="passage">${q.passage}</div>
        `;

        q.statements.forEach(s => {
          const userVal = userAnswers[q.id] && userAnswers[q.id][s.key];
          let stmtClass = 'statement';
          let badge = '';

          if (submitted) {
            if (userVal === s.correct) {
              stmtClass += ' correct-bg';
              badge = `<span class="result-badge badge-correct">Đúng</span>`;
            } else {
              stmtClass += ' wrong-bg';
              badge = `<span class="result-badge badge-wrong">Sai</span>`;
            }
          }

          html += `
            <div class="${stmtClass}">
              <div class="stmt-text">${s.text}${badge}</div>
              <div class="options">
                <button class="opt-btn ${userVal === true ? 'selected-dung' : ''}" 
                        ${submitted ? 'disabled' : ''}
                        onclick="selectAnswer(${q.id}, '${s.key}', true)">Đúng</button>
                <button class="opt-btn ${userVal === false ? 'selected-sai' : ''}" 
                        ${submitted ? 'disabled' : ''}
                        onclick="selectAnswer(${q.id}, '${s.key}', false)">Sai</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = html;
        area.appendChild(card);
      });
    }

    // Khởi tạo
    renderQuiz();
  </script>
