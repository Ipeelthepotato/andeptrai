<script>
const DATA=[{"stem": "Câu 1. Nhằm duy trì hoà bình và an ninh thế giới sau chiến tranh, Hội nghị I-an-ta (2-1945) có quyết định quan trọng nào sau đây?", "opts": [{"k": "A", "v": "Thành lập Ban Thư kí Liên hợp quốc."}, {"k": "B", "v": "Thành lập tổ chức Hội Quốc liên."}, {"k": "C", "v": "Thành lập tổ chức Liên hợp quốc."}, {"k": "D", "v": "Duy trì và mở rộng Hội Quốc liên."}], "ans": "C"}, {"stem": "Câu 2. Từ cuối tháng 4 đến cuối tháng 6-1945, 50 nước họp tại Xan Phran-xi-xcô (Mỹ) thông qua nội dung nào sau đây?", "opts": [{"k": "A", "v": "Tiêu diệt tận gốc phát xít Nhật."}, {"k": "B", "v": "Xét xử tội phạm chiến tranh thế giới."}, {"k": "C", "v": "Kết thúc chiến tranh Triều Tiên."}, {"k": "D", "v": "Hiến chương Liên hợp quốc."}], "ans": "D"}, {"stem": "Câu 3. Tổ chức Liên hợp quốc chính thức thành lập với sự kiện nào sau đây?", "opts": [{"k": "A", "v": "Đại diện 50 nước họp thông qua Hiến chương Liên hợp quốc (6/1945)."}, {"k": "B", "v": "Quốc hội các nước thành viên phê chuẩn Hiến chương Liên hợp quốc (10/1945)."}, {"k": "C", "v": "Hội nghị Ianta quyết định thành lập tổ chức Liên hợp quốc (2/1945)."}, {"k": "D", "v": "26 nước kí kết“Tuyên bố Liên hợp quốc” tại Oa-sinh-tơn (1942)."}], "ans": "B"}, {"stem": "Câu 4. Quá trình hình thành Liên hợp quốc gắn liền với vai trò quan trọng của các quốc gia nào sau đây?", "opts": [{"k": "A", "v": "Liên Xô, Trung Quốc, Đức."}, {"k": "B", "v": "Liên Xô, Mỹ, Anh."}, {"k": "C", "v": "Liên Xô, Mỹ, Đức."}, {"k": "D", "v": "Mỹ, Anh, Pháp."}], "ans": "B"}, {"stem": "Câu 5. Năm 1945, bản Hiến chương Liên hợp quốc được thông qua tại", "opts": [{"k": "A", "v": "hội nghị Tam cường I-an-ta."}, {"k": "B", "v": "hội nghị Xan Phran-xi-xcô."}, {"k": "C", "v": "hội nghị Bàn Môn Điếm."}, {"k": "D", "v": "hội nghị Vécxai - Oasinhtơn."}], "ans": "B"}, {"stem": "Câu 6. Tổ chức Liên hợp quốc được thành lập trong bối cảnh nhân dân thế giới ý thức sâu sắc về hậu quả của", "opts": [{"k": "A", "v": "chiến tranh lạnh."}, {"k": "B", "v": "khủng hoảng kinh tế."}, {"k": "C", "v": "phân hóa giàu nghèo."}, {"k": "D", "v": "chiến tranh thế giới."}], "ans": "D"}, {"stem": "Câu 7. “Duy trì hoà bình và an ninh thế giới; thúc đẩy quan hệ hữu nghị giữa các quốc gia dựa trên sự tôn trọng nguyên tắc bình đẳng và quyền tự quyết của các dân tộc, củng cố hoà bình thế giới” là mục tiêu chính của tổ chức quốc tế nào sau đây?", "opts": [{"k": "A", "v": "Tổ chức ASEAN."}, {"k": "B", "v": "Liên minh châu Âu."}, {"k": "C", "v": "Liên hợp quốc."}, {"k": "D", "v": "Tổ chức NATO."}], "ans": "C"}, {"stem": "Câu 8. Bản Hiến chương Liên hợp quốc đã được thông qua khi cuộc chiến tranh thế giới thứ hai", "opts": [{"k": "A", "v": "bước vào giai đoạn quyết liệt."}, {"k": "B", "v": "bước vào giai đoạn kết thúc."}, {"k": "C", "v": "bắt đầu lan ra khu vực châu Á."}, {"k": "D", "v": "bắt dầu lan ra khu vực châu Phi."}], "ans": "B"}, {"stem": "Câu 9. Tổ chức Liên hợp quốc chính thức thành lập khi cuộc chiến tranh thế giới thứ hai", "opts": [{"k": "A", "v": "bước vào giai đoạn quyết liệt."}, {"k": "B", "v": "bước vào giai đoạn kết thúc."}, {"k": "C", "v": "bắt đầu lan ra rộng ở châu Á."}, {"k": "D", "v": "đã kết thúc."}], "ans": "D"}, {"stem": "Câu 10. Nội dung nào sau đây không phản ánh đúng bối cảnh lịch sử hình thành tổ chức Liên hợp quốc?", "opts": [{"k": "A", "v": "Nhân dân thế giới có khát vọng được chung sống hòa bình."}, {"k": "B", "v": "Chủ nghĩa phát xít xuất hiện và cầm quyền ở nhiều nước."}, {"k": "C", "v": "Ý thức của các nước Đồng minh về việc tổ chức thế giới."}, {"k": "D", "v": "Nhu cầu thành lập tổ chức quốc tế mới thay thế tổ chức cũ."}], "ans": "B"}, {"stem": "Câu 11. Nhận xét nào sau đây phản ánh không đúng về sự thành lập tổ chức Liên hợp quốc?", "opts": [{"k": "A", "v": "Phù hợp với khát vọng hòa bình chung của nhân dân thế giới."}, {"k": "B", "v": "Quá trình hình thành trải qua nhiều hội nghị quốc tế khác nhau."}, {"k": "C", "v": "Các cường quốc Đồng minh giữ vai trò chủ đạo trong việc thành lập."}, {"k": "D", "v": "Quá trình thành lập lâu dài và chịu ảnh hưởng của Chiến tranh lạnh."}], "ans": "D"}, {"stem": "Câu 12. Vai trò của Liên hợp quốc trong việc bảo đảm quyền con người được thể hiện như thế nào?", "opts": [{"k": "A", "v": "Ban hành các văn kiện quốc tế nhằm thúc đẩy và bảo vệ quyền con người."}, {"k": "B", "v": "Trực tiếp quản lí mọi hoạt động của các quốc gia thành viên."}, {"k": "C", "v": "Thay thế chính phủ các nước trong việc thực hiện quyền con người."}, {"k": "D", "v": "Xóa bỏ hoàn toàn mọi hình thức vi phạm quyền con người trên thế giới."}], "ans": "A"}, {"stem": "Câu 13.Hội nghị quốc tế nào quyết định những vấn đề quan trọng về việc phân chia khu vực ảnh hưởng giữa các cường quốc thắng trận, đặt nền móng cho sự hình thành Trật tự thế giới hai cực?", "opts": [{"k": "A", "v": "Hội nghị Ianta (2/1945)."}, {"k": "B", "v": "Hội nghị Pốtsđam (7/1945)."}, {"k": "C", "v": "Hội nghị Véc-sai (1919)."}, {"k": "D", "v": "Hội nghị Oa -sinh-tơn (1921)."}], "ans": "A"}, {"stem": "Câu 14. Nhận xét nào sau đây phản ánh đúng về sự thành lập tổ chức Liên hợp quốc?", "opts": [{"k": "A", "v": "Là kết quả cũng những thỏa thuận giữa Liên Xô và Anh."}, {"k": "B", "v": "Phù hợp với khát vọng hòa bình chung của nhân dân thế giới."}, {"k": "C", "v": "Các nước phát xít giữ vai trò chủ đạo trong việc thành lập."}, {"k": "D", "v": "Quá trình thành lập lâu dài và chịu ảnh hưởng của Chiến tranh lạnh."}], "ans": "B"}, {"stem": "Câu 15. Mục tiêu nào sau đây của Liên hợp quốc là cơ sở cho các mục tiêu khác", "opts": [{"k": "A", "v": "duy trì hòa bình an ninh quốc tế."}, {"k": "B", "v": "thúc đẩy quan hệ hữu nghị giữa các dân tộc."}, {"k": "C", "v": "giải quyết các vấn đề về an ninh kinh tế xã hội."}, {"k": "D", "v": "đảm bảo quyền con người, không phân biệt chủng tộc."}], "ans": "A"}, {"stem": "Câu 16. Liên hợp quốc được thành lập (1945) không nhằm mục tiêu nào sau đây?", "opts": [{"k": "A", "v": "Hợp tác quốc tế giữa các nước thành viên."}, {"k": "B", "v": "Duy trì nền hoà bình và an ninh trên thế giới."}, }
function start(){list=selectSet();answers={};checked={};$('quiz').innerHTML='';
 if(!list.length){$('quiz').innerHTML='<section class="panel">Chưa có câu sai được lưu trong phiên này. Hãy làm một lượt trước nhé.</section>';update();return}
 list.forEach((q,j)=>{let el=document.createElement('section');el.className='question';el.id='q'+j;
 el.innerHTML=`<div class="qhead"><span class="num">${j+1}/${list.length}</span><div class="stem">${esc(q.stem)}</div></div><div class="opts"></div><div class="feedback hidden" id="fb${j}"></div><div class="qactions"><button class="primary" data-check="${j}">Kiểm tra</button><button data-clear="${j}">Bỏ chọn</button></div>`;
 const opts=el.querySelector('.opts');q.opts.forEach(o=>{let lab=document.createElement('label');lab.className='option';lab.innerHTML=`<input type="radio" name="q${j}" value="${o.k}"><span><b>${o.k}.</b> ${esc(o.v)}</span>`;lab.querySelector('input').addEventListener('change',e=>{answers[j]=e.target.value;});opts.append(lab)});
 $('quiz').append(el);
 });
 $('quiz').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>check(+b.dataset.check));
 $('quiz').querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{delete answers[b.dataset.clear];let n=+b.dataset.clear;$('q'+n).querySelectorAll('input').forEach(x=>x.checked=false)});
 update();$('result').textContent='Đã tải '+list.length+' câu. Chọn đáp án và kiểm tra.';
}
function check(j){let q=list[j];if(!answers[j]){$('fb'+j).className='feedback';$('fb'+j).textContent='Bạn hãy chọn một đáp án trước nhé.';return}
 let good=answers[j]===q.ans;checked[j]=good;if(good)wrongSet.delete(q.idx);else wrongSet.add(q.idx);
 const fb=$('fb'+j);fb.className='feedback '+(good?'good':'bad');fb.classList.remove('hidden');fb.textContent=good?'Chính xác!':'Chưa đúng. Đáp án theo bộ đáp án hiện tại: '+q.ans+'. Hãy xem lại kiến thức liên quan trong đề cương.';
 $('q'+j).querySelectorAll('.option').forEach(l=>{let v=l.querySelector('input').value;l.classList.toggle('correct',v===q.ans);l.classList.toggle('wrong',v===answers[j]&&!good)});
 update();
}
function update(){let done=Object.keys(checked).length;let right=Object.values(checked).filter(Boolean).length;
 $('stats').textContent=`Đã kiểm tra ${done}/${list.length} câu • Đúng ${right} • Sai ${done-right} • Câu sai cần ôn: ${wrongSet.size}`;
 $('bar').style.width=(list.length?done/list.length*100:0)+'%';$('result').textContent=done?`Kết quả lượt hiện tại: ${right}/${done} câu đúng (${Math.round(right/done*100)}%).`:'Hãy trả lời câu hỏi rồi bấm “Kiểm tra”.';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=start;$('mode').onchange=start;$('reset').onclick=()=>{answers={};checked={};wrongSet.clear();start()};$('review').onclick=()=>{$('mode').value='wrong';start();window.scrollTo({top:0,behavior:'smooth'})};start();
</script></body></html>
